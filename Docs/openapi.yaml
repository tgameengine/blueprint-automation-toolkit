openapi: 3.0.3
info:
  title: Blueprint Automation Toolkit
  version: 0.2.0
  description: |
    Editor-only localhost automation API for Unreal Engine.
    Mutating editor-asset routes return 409 pie_edit_blocked while PIE is running; stop PIE before retrying asset or Blueprint edits.
servers:
  - url: http://127.0.0.1:9876
security:
  - bearerAuth: []
paths:
  /ai/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /ai/capabilities:
    get:
      summary: Server capabilities and limits
      responses:
        '200':
          description: Capabilities
  /engine/discover:
    get:
      summary: Recommended engine handshake endpoint
      description: Preferred first request for agents and automation clients. Returns handshake metadata, recommended discovery flow, and high-level capability hints before reflection or action requests.
      responses:
        '200':
          description: Discovery and handshake metadata
  /openapi:
    get:
      summary: Returns this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
  /ai/exec:
    post:
      summary: Execute console commands or optional Python inside the editor
      description: Remote execution endpoint. Requires exec permission and returns 409 pie_edit_blocked for editor mutations that are disallowed during PIE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                commands:
                  type: array
                  items:
                    type: string
                python:
                  type: string
                world:
                  type: string
                  enum: [auto, editor, pie]
                pie_index:
                  type: integer
                require_world:
                  type: boolean
      responses:
        '200':
          description: Exec result
  /uobject/get:
    post:
      summary: Get UObject property values via reflection
      description: Returns scalar values plus object and class references as Unreal object path strings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, properties]
              properties:
                path:
                  type: string
                properties:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Property values
  /uobject/set:
    post:
      summary: Set UObject properties via reflection
      description: Accepts scalar values plus object and class references encoded as Unreal object path strings. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, values]
              properties:
                path:
                  type: string
                values:
                  type: object
                  description: Property assignments. Class and object properties accept string references such as /Game/MyBP.MyBP_C or /Game/MyAsset.MyAsset.
      responses:
        '200':
          description: Property update result
  /object/resolve:
    post:
      summary: Resolve a UObject from a generic reflection identifier
      description: Resolves object paths, soft object paths, actor names, selected actors, blueprint asset paths, and class paths into a stable object reference for automation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionResolveRequest'
      responses:
        '200':
          description: Reflection resolve result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /object/get:
    post:
      summary: Read safe reflected property values from a UObject
      description: Returns selected properties or all supported safe-readable properties as stable JSON values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionGetRequest'
      responses:
        '200':
          description: Reflection get result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /object/list-properties:
    post:
      summary: List reflected properties on a UObject
      description: Returns reflected property metadata so external tools and AI agents can discover writable and readable properties dynamically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionObjectRequest'
      responses:
        '200':
          description: Reflection property list result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /object/set-property:
    post:
      summary: Set a reflected UObject property
      description: Supports primitive values, enums, object references, common structs, and arrays of supported scalar or object reference types. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionSetPropertyRequest'
      responses:
        '200':
          description: Property update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /uobject/call:
    post:
      summary: Call an allowlisted UFunction on a UObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, function]
              properties:
                path:
                  type: string
                function:
                  type: string
                args:
                  type: object
      responses:
        '200':
          description: Function call result
  /object/list-functions:
    post:
      summary: List callable reflected functions on a UObject
      description: Returns callable function metadata including parameter information, return types, and safe-mode callability hints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionObjectRequest'
      responses:
        '200':
          description: Reflection function list result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /object/call-function:
    post:
      summary: Call a safe reflected UFunction on a UObject
      description: Maps JSON arguments into reflected parameters, rejects unsupported signatures, and returns both return value and output parameters in stable JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionCallFunctionRequest'
      responses:
        '200':
          description: Function call result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /actor/spawn:
    post:
      summary: Spawn an actor and optionally set initial properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class:
                  type: string
                name:
                  type: string
                location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                rotation:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                scale:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                properties:
                  type: object
      responses:
        '200':
          description: Spawn result
  /actor/find:
    post:
      summary: Find actors by tag, name, or class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by, value]
              properties:
                by:
                  type: string
                  enum: [tag, name, class]
                value:
                  type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Actor find result
  /asset/duplicate:
    post:
      summary: Duplicate an asset to a destination package path
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                src:
                  type: string
                dst:
                  type: string
                duplicates:
                  type: array
                  items:
                    type: object
                    required: [src, dst]
                    properties:
                      src:
                        type: string
                      dst:
                        type: string
                save:
                  type: boolean
              anyOf:
                - required: [src, dst]
                - required: [duplicates]
      responses:
        '200':
          description: Duplicate result
  /asset/save:
    post:
      summary: Save one or more assets
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties:
                paths:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Save result
  /asset/delete:
    post:
      summary: Delete one or more assets
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                paths:
                  type: array
                  items:
                    type: string
                force:
                  type: boolean
                  description: Force delete assets even when Unreal still sees editor-side references.
              anyOf:
                - required: [path]
                - required: [paths]
      responses:
        '200':
          description: Delete result
  /asset/create:
    post:
      summary: Create an asset instance from a UObject class
      description: |
        Returns 409 pie_edit_blocked while PIE is running.

        `class: /Script/Engine.AnimSequence` supports standalone animation authoring on this route.
        Provide `path`, `skeleton`, optional `preview_mesh`, optional `frame_rate`, optional `number_of_frames`,
        optional `tracks`, optional `forward_axis`, and optional `save`.

        Each track entry uses `bone_name` plus optional `position_keys`, `rotation_keys`, and `scale_keys`.
        `rotation_keys` entries accept either `[pitch, yaw, roll]` or quaternion `[x, y, z, w]` arrays.
        When `forward_axis` is provided, incoming track vectors and rotations are remapped into Unreal's `+X` forward frame before the asset is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class:
                  type: string
                path:
                  type: string
                outer:
                  type: string
                skeleton:
                  type: string
                preview_mesh:
                  type: string
                frame_rate:
                  type: number
                number_of_frames:
                  type: integer
                forward_axis:
                  type: string
                  enum: [X, Y, Z]
                save:
                  type: boolean
                tracks:
                  type: array
                  items:
                    type: object
                    required: [bone_name]
                    properties:
                      bone_name:
                        type: string
                      position_keys:
                        type: array
                        items:
                          type: array
                          minItems: 3
                          maxItems: 3
                          items:
                            type: number
                      rotation_keys:
                        type: array
                        items:
                          oneOf:
                            - type: array
                              minItems: 3
                              maxItems: 3
                              items:
                                type: number
                            - type: array
                              minItems: 4
                              maxItems: 4
                              items:
                                type: number
                      scale_keys:
                        type: array
                        items:
                          type: array
                          minItems: 3
                          maxItems: 3
                          items:
                            type: number
      responses:
        '200':
          description: Create result
  /actions/list:
    get:
      summary: List registered BAT actions
      responses:
        '200':
          description: Action list
  /actions/run:
    post:
      summary: Run a named BAT action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                args:
                  type: object
      responses:
        '200':
          description: Action run result
  /pcg/spawn_spheres:
    post:
      summary: Duplicate PCG sphere template and spawn a host actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dst_graph]
              properties:
                dst_graph:
                  type: string
                location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                extent:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                mesh:
                  type: string
                count:
                  type: integer
                seed:
                  type: integer
      responses:
        '200':
          description: PCG spawn result
  /jobs/submit:
    post:
      summary: Submit an async job
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          $ref: '#/components/responses/Error400'
  /jobs/{jobId}:
    get:
      summary: Get job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/Error404'
  /jobs/{jobId}/cancel:
    post:
      summary: Request cancel for a job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel requested
        '404':
          $ref: '#/components/responses/Error404'
  /logs/tail:
    get:
      summary: Recent structured logs
      parameters:
        - in: query
          name: n
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        '200':
          description: Recent logs
  /ai/pie/start:
    post:
      summary: Submit PIE start job
      responses:
        '202':
          description: Job created
  /ai/pie/stop:
    post:
      summary: Submit PIE stop job
      responses:
        '202':
          description: Job created
  /ai/editor/layout/apply:
    post:
      summary: Submit editor layout apply job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actors]
              properties:
                actors:
                  type: array
                  items:
                    type: object
      responses:
        '202':
          description: Job created
  /ai/plan/validate:
    post:
      summary: Validate a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Validation result
  /ai/plan/apply:
    post:
      summary: Submit a plan apply job
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '202':
          description: Job created
  /blueprint/create:
    post:
      summary: Submit blueprint creation job
      description: Returns 409 pie_edit_blocked while PIE is running.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                parent:
                  type: string
                compile:
                  type: boolean
      responses:
        '202':
          description: Job created
  /blueprint/compile:
    post:
      summary: Submit blueprint compile job
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        '202':
          description: Job created
  /blueprint/save:
    post:
      summary: Submit blueprint save job
      description: Returns 409 pie_edit_blocked while PIE is running.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        '202':
          description: Job created
  /blueprint/components/remove:
    post:
      summary: Remove a Blueprint component by name
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, name]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                missing_ok:
                  type: boolean
                  description: When true, no error is returned if the component does not exist.
                compile:
                  type: boolean
                  description: Compile the Blueprint after the remove operation.
      responses:
        '200':
          description: Remove operation result
        '400':
          $ref: '#/components/responses/Error400'
  /blueprint/components/replace:
    post:
      summary: Replace a Blueprint component in-place (remove + add + set)
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, name, class]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                class:
                  type: string
                  minLength: 1
                  description: Component class path for the replacement component.
                static_mesh:
                  type: string
                material0:
                  type: string
                mobility:
                  type: string
                relative_location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                relative_rotation:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                relative_scale3d:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                num_custom_data_floats:
                  type: integer
                compile:
                  type: boolean
                  description: Compile the Blueprint after replacement.
      responses:
        '200':
          description: Replace operation result
        '400':
          $ref: '#/components/responses/Error400'
  /blueprint/graph/apply:
    post:
      summary: Apply blueprint graph edits (nodes and links)
      description: Returns 409 pie_edit_blocked while PIE is running. AnimGraph nodes can provide `forward_axis` to remap vector, rotator, quaternion, and transform properties into Unreal's `+X` forward frame before import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, graph, nodes, links]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      forward_axis:
                        type: string
                        enum: [X, Y, Z]
                links:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Graph apply result
  /blueprint/apply:
    post:
      summary: Apply a generic Blueprint edit plan
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, ops]
              properties:
                blueprint:
                  type: string
                ops:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Blueprint plan apply result
  /blueprint/schema:
    post:
      summary: Read Blueprint authoring schema and discovery metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
                include:
                  type: array
                  items:
                    type: string
                function_filter:
                  type: object
                  properties:
                    class:
                      type: string
                    search:
                      type: string
                    blueprint_callable_only:
                      type: boolean
                    exclude_latent:
                      type: boolean
                    exclude_unsafe:
                      type: boolean
                    limit:
                      type: integer
      responses:
        '200':
          description: Blueprint schema result
  /blueprint/graph/nodes:
    post:
      summary: Read normalized graph node metadata for a Blueprint graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, graph]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
      responses:
        '200':
          description: Graph nodes snapshot
  /blueprint/compile_save:
    post:
      summary: Compile and save a blueprint in one request
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
      responses:
        '200':
          description: Compile and save result
  /blueprint/graph/links:
    get:
      summary: Read normalized graph nodes and links
      parameters:
        - in: query
          name: blueprint
          required: true
          schema:
            type: string
        - in: query
          name: graph
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Graph links snapshot
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    Error:
      type: object
      required: [code, message, details, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
    ReflectionObjectRequest:
      type: object
      properties:
        objectPath:
          type: string
        softObjectPath:
          type: string
        actorName:
          type: string
        selectedActor:
          type: boolean
        blueprintAssetPath:
          type: string
        classPath:
          type: string
        requiredClass:
          type: string
        worldContext:
          type: string
          enum: [Editor, PIE, editor, pie]
        pieIndex:
          type: integer
        responseOutputPath:
          type: string
          description: Optional relative file path under the toolkit response export directory. When set, the HTTP response body is also written to disk and the request requires filesystem permission.
      description: Provide at least one object resolution field.
    ReflectionResolveRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
    ReflectionGetRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          properties:
            properties:
              type: array
              items:
                type: string
    ReflectionSetPropertyRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          properties:
            property:
              type: string
            value:
              description: Reflected value to assign.
              nullable: true
            values:
              type: object
              additionalProperties: true
          anyOf:
            - required: [property, value]
            - required: [values]
    ReflectionCallFunctionRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          required: [function]
          properties:
            function:
              type: string
            arguments:
              type: object
              additionalProperties: true
            args:
              type: object
              additionalProperties: true
    ReflectionStructuredResponse:
      type: object
      required: [success, requestId]
      properties:
        success:
          type: boolean
        requestId:
          type: string
        data:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    JobSubmitRequest:
      type: object
      required: [kind, payload]
      properties:
        kind:
          type: string
          minLength: 1
        payload:
          type: object
          additionalProperties: true
    JobSubmitResponse:
      type: object
      required: [jobId, requestId]
      properties:
        jobId:
          type: string
        requestId:
          type: string
    JobStatus:
      type: object
      required: [jobId, state, progress, requestId, logs]
      properties:
        jobId:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        progress:
          type: number
        requestId:
          type: string
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        logs:
          type: array
          items:
            type: string
    PlanRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            type: object
            required: [op, payload]
            properties:
