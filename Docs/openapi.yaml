openapi: 3.0.3
info:
  title: Blueprint Automation Toolkit Editor Bridge
  version: 0.3.2
  description: |
    Secure typed localhost automation bridge for Unreal Editor.
    The canonical agent flow is discover -> inspect -> resolve -> mutate -> compile or validate -> inspect diagnostics -> save or focus.
    Mutating editor-asset routes return 409 pie_edit_blocked while PIE is running; stop PIE before retrying asset or Blueprint edits.
    Optional advanced surfaces such as exec or jobs are not part of the core bridge workflow and may be policy-gated or disabled.
servers:
  - url: http://127.0.0.1:9876
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Preferred lightweight health check
      responses:
        '200':
          description: OK
  /ai/capabilities:
    get:
      summary: Canonical capability summary for agents
      description: Stable machine-readable capability, limit, and permission summary for tooling and agents.
      responses:
        '200':
          description: Capabilities
  /engine/discover:
    get:
      summary: Canonical engine handshake endpoint
      description: Preferred first request for agents and automation clients. Returns protocol metadata, current gates, preferred routes, and capability flags before object or Blueprint requests.
      responses:
        '200':
          description: Discovery and handshake metadata
  /openapi:
    get:
      summary: Returns this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
  /ai/exec:
    post:
      summary: Optional legacy execution surface
      description: Optional advanced endpoint. Not part of the core editor bridge workflow. Requires exec permission and may be disabled by policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                commands:
                  type: array
                  items:
                    type: string
                python:
                  type: string
                world:
                  type: string
                  enum: [auto, editor, pie]
                pie_index:
                  type: integer
                require_world:
                  type: boolean
      responses:
        '200':
          description: Exec result
  /object/resolve:
    post:
      summary: Canonically resolve an automation target
      description: Resolves target, objectPath, actorName, blueprintAssetPath, selectedActor, or classPath into a stable object reference for follow-up object and Blueprint requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionResolveRequest'
      responses:
        '200':
          description: Reflection resolve result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReflectionStructuredResponse'
  /object/describe:
    get:
      summary: Describe an automation target from query parameters
      parameters:
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: objectPath
          schema:
            type: string
        - in: query
          name: actorName
          schema:
            type: string
        - in: query
          name: verbose
          schema:
            type: boolean
      responses:
        '200':
          description: Reflection describe result
  /object/get_property:
    get:
      summary: Preferred reflected property read endpoint
      description: Reads one property via `property` or multiple properties via comma-separated `properties`.
      parameters:
        - in: query
          name: target
          schema:
            type: string
        - in: query
          name: objectPath
          schema:
            type: string
        - in: query
          name: actorName
          schema:
            type: string
        - in: query
          name: property
          schema:
            type: string
        - in: query
          name: properties
          schema:
            type: string
      responses:
        '200':
          description: Property read result
  /object/set_property:
    post:
      summary: Preferred reflected property write endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionSetPropertyRequest'
      responses:
        '200':
          description: Property update result
  /object/call_function:
    post:
      summary: Preferred reflected function call endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionCallFunctionRequest'
      responses:
        '200':
          description: Function call result
  /actor/spawn:
    post:
      summary: Spawn an actor and optionally set initial properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class:
                  type: string
                name:
                  type: string
                location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                rotation:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                scale:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                properties:
                  type: object
      responses:
        '200':
          description: Spawn result
  /actor/destroy:
    post:
      summary: Destroy a resolved editor actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                objectPath:
                  type: string
                actorName:
                  type: string
      responses:
        '200':
          description: Destroy result
  /actor/find:
    post:
      summary: Find actors by tag, name, or class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by, value]
              properties:
                by:
                  type: string
                  enum: [tag, name, class]
                value:
                  type: string
                limit:
                  type: integer
      responses:
        '200':
          description: Actor find result
  /editor/level/audit:
    post:
      summary: Audit editor level actors with composable filters
      description: Lists matching actors and returns counts by class without requiring Python execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelActorFilterRequest'
      responses:
        '200':
          description: Level actor audit result
  /editor/level/destroy_actors:
    post:
      summary: Destroy editor level actors matched by filters
      description: |
        Uses the same filter language as `/editor/level/audit`.
        Refuses an empty filter unless `allowAll=true`; pass `dryRun=true` to preview matches.
        Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LevelActorFilterRequest'
                - type: object
                  properties:
                    dryRun:
                      type: boolean
                    allowAll:
                      type: boolean
                    allowPartial:
                      type: boolean
                    maxDelete:
                      type: integer
                      minimum: 1
                      maximum: 5000
      responses:
        '200':
          description: Destroy result or dry-run preview
  /editor/level/save:
    post:
      summary: Save dirty editor map and optional content packages
      description: Saves map packages and, by default, dirty content packages so World Partition external actor packages are persisted. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                saveContentPackages:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Level save result
  /editor/level/create:
    post:
      summary: Create and save a new editor map
      description: Creates a blank map or a map based on an optional template. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map:
                  type: string
                mapPackage:
                  type: string
                package:
                  type: string
                path:
                  type: string
                overwrite:
                  type: boolean
                  default: false
                saveExistingMap:
                  type: boolean
                  default: true
                saveBeforeCreate:
                  type: boolean
                  description: Alias for saveExistingMap.
                template:
                  type: string
                templateMap:
                  type: string
                  description: Alias for template.
              anyOf:
                - required: [map]
                - required: [mapPackage]
                - required: [package]
                - required: [path]
      responses:
        '200':
          description: Map creation result
  /editor/level/load:
    post:
      summary: Load an editor map by package or filename
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map:
                  type: string
                mapPackage:
                  type: string
                package:
                  type: string
                path:
                  type: string
                filename:
                  type: string
                saveBeforeLoad:
                  type: boolean
                showProgress:
                  type: boolean
              anyOf:
                - required: [map]
                - required: [mapPackage]
                - required: [package]
                - required: [path]
                - required: [filename]
      responses:
        '200':
          description: Level load result
  /editor/select:
    post:
      summary: Select one or more actors in the editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                replace:
                  type: boolean
                target:
                  type: string
                targets:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
      responses:
        '200':
          description: Selection result
  /editor/focus:
    post:
      summary: Focus an actor viewport or asset editor on a resolved target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                objectPath:
                  type: string
                actorName:
                  type: string
                select:
                  type: boolean
      responses:
        '200':
          description: Focus result
  /asset/duplicate:
    post:
      summary: Duplicate an asset to a destination package path
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                src:
                  type: string
                dst:
                  type: string
                duplicates:
                  type: array
                  items:
                    type: object
                    required: [src, dst]
                    properties:
                      src:
                        type: string
                      dst:
                        type: string
                save:
                  type: boolean
              anyOf:
                - required: [src, dst]
                - required: [duplicates]
      responses:
        '200':
          description: Duplicate result
  /asset/save:
    post:
      summary: Canonically save one or more assets
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                path:
                  type: string
                paths:
                  type: array
                  items:
                    type: string
              anyOf:
                - required: [target]
                - required: [path]
                - required: [paths]
      responses:
        '200':
          description: Save result
  /material/texture_samples/set:
    post:
      summary: Assign textures to material texture expressions and save the material
      description: |
        Updates texture-bearing material expressions by their UObject names. Both Texture Sample and
        Texture Object expressions are supported. All material expressions and texture assets are
        resolved before the material is changed. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material]
              properties:
                material:
                  type: string
                  description: Material package or object path.
                textures:
                  type: object
                  additionalProperties:
                    type: string
                  description: Map from material expression UObject name to texture package or object path.
                assignments:
                  type: array
                  items:
                    type: object
                    required: [expression, texture]
                    properties:
                      expression:
                        type: string
                      texture:
                        type: string
                recompile:
                  type: boolean
                  default: true
                save:
                  type: boolean
                  default: true
              anyOf:
                - required: [textures]
                - required: [assignments]
      responses:
        '200':
          description: Updated material texture expressions, compile state, and save state
        '400':
          description: Invalid material assignment request
        '404':
          description: Material, texture expression, or texture asset was not found
        '409':
          description: Material edits are blocked while PIE is running
  /asset/create:
    post:
      summary: Create an asset instance from a UObject class
      description: |
        Returns 409 pie_edit_blocked while PIE is running.

        `class: /Script/Engine.AnimSequence` supports standalone animation authoring on this route.
        Provide `path`, `skeleton`, optional `preview_mesh`, optional `frame_rate`, optional `number_of_frames`,
        optional `tracks`, optional `forward_axis`, and optional `save`.

        Each track entry uses `bone_name` plus optional `position_keys`, `rotation_keys`, and `scale_keys`.
        `rotation_keys` entries accept either `[pitch, yaw, roll]` or quaternion `[x, y, z, w]` arrays.
        When `forward_axis` is provided, incoming track vectors and rotations are remapped into Unreal's `+X` forward frame before the asset is written.
        Canonical values are `X`, `-X`, `Y`, `-Y`, `Z`, and `-Z`; aliases such as `+Y`, `right`, `left`, `forward`, `backward`, `up`, and `down` are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [class]
              properties:
                class:
                  type: string
                path:
                  type: string
                outer:
                  type: string
                skeleton:
                  type: string
                preview_mesh:
                  type: string
                frame_rate:
                  type: number
                number_of_frames:
                  type: integer
                forward_axis:
                  type: string
                  description: Canonical values `X`, `-X`, `Y`, `-Y`, `Z`, and `-Z`; aliases like `+Y`, `right`, `left`, `forward`, `backward`, `up`, and `down` are also accepted.
                save:
                  type: boolean
                tracks:
                  type: array
                  items:
                    type: object
                    required: [bone_name]
                    properties:
                      bone_name:
                        type: string
                      position_keys:
                        type: array
                        items:
                          type: array
                          minItems: 3
                          maxItems: 3
                          items:
                            type: number
                      rotation_keys:
                        type: array
                        items:
                          oneOf:
                            - type: array
                              minItems: 3
                              maxItems: 3
                              items:
                                type: number
                            - type: array
                              minItems: 4
                              maxItems: 4
                              items:
                                type: number
                      scale_keys:
                        type: array
                        items:
                          type: array
                          minItems: 3
                          maxItems: 3
                          items:
                            type: number
      responses:
        '200':
          description: Create result
  /asset/import/formats:
    get:
      summary: Discover asset import formats and security limits
      description: Returns the configured source roots, extension allowlist, per-file and batch size limits, common FBX modes, and pipeline feature flags.
      responses:
        '200':
          description: Import capabilities and active allowlists
  /asset/import:
    post:
      summary: Import model, animation, texture, audio, or interchange source files
      description: |
        Imports through Unreal's registered editor importers. Source files must be inside an Asset Import
        Allowed Root, use an allowed extension, and remain below the configured size limit. Relative sources
        resolve from the project directory and destinations are restricted to `/Game`.

        FBX receives typed convenience options. Other formats use the active Unreal importer (for example
        Interchange for glTF/GLB). Advanced callers can provide allowlisted `factory_class`, `options_class`,
        `factory_properties`, and `options_properties`. BAT stores a source MD5 fingerprint on every imported
        asset so `skip_unchanged` is idempotent. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetImportRequest'
      responses:
        '200':
          description: Dry-run or all sources were unchanged
        '201':
          description: Imported asset result and created object paths
        '403':
          description: Source path or adapter denied by the asset pipeline policy
        '413':
          description: The combined primary-source batch size exceeded the configured limit
        '422':
          description: Importer failed or returned an unexpected asset type
  /asset/inspect:
    post:
      summary: Inspect imported assets and their Unreal relationships
      description: |
        Returns normalized type-specific information for Static Meshes, Skeletal Meshes, animations,
        textures, materials, Skeletons, and Physics Assets. Dependency and referencer queries use the
        Asset Registry. This read-only route remains available during PIE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetTargetRequest'
      responses:
        '200':
          description: Asset inspection snapshot
        '404':
          description: At least one asset was not found
  /asset/configure:
    post:
      summary: Repair or configure imported assets
      description: |
        Supports automated reimport, material-slot assignment, texture color/compression settings,
        Static Mesh build settings, Nanite, generated box collision, Skeleton assignment, and Physics
        Asset creation. `mode: safe_auto` applies conservative normal-map and missing-collision/physics
        fixes. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetConfigureRequest'
      responses:
        '200':
          description: Applied actions and save state
        '400':
          description: Configuration field, slot, or asset type is invalid
        '422':
          description: Reimport or repair failed
  /asset/validate:
    post:
      summary: Validate assets with default, production, strict, or Fab rules
      description: |
        Produces per-asset error/warning issues, suggested repair actions, and a score. Strict, production,
        and Fab profiles require collision for Static Meshes, Physics Assets for Skeletal Meshes, valid
        skeletons and animation samples, assigned material slots, and BAT source provenance. This read-only
        route remains available during PIE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetValidateRequest'
      responses:
        '200':
          description: Validation passed without errors
        '422':
          description: Validation completed with one or more errors
  /asset/pipeline/execute:
    post:
      summary: Execute an ordered agent-oriented asset pipeline
      description: |
        Runs up to 50 `import`, `inspect`, `configure`/`repair`, `validate`, and `showcase`/`capture` steps.
        Later steps may omit targets to consume the preceding import result or use `path: "$imported"`.
        `dry_run` propagates to mutating operations. On failure BAT can delete assets newly created by the
        current run; replaced assets and already-saved configuration edits are intentionally outside that
        rollback scope. Set `async: true` to return a job ID and poll `/jobs/{jobId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPipelineRequest'
      responses:
        '200':
          description: Synchronous pipeline result
        '202':
          description: Asynchronous pipeline job accepted
        '422':
          description: One or more pipeline steps failed
  /asset/showcase/capture:
    post:
      summary: Place a mesh in the editor and capture verification evidence
      description: |
        Spawns a Static Mesh or Skeletal Mesh actor, optionally binds an AnimSequence, focuses the active
        editor viewport, and writes a PNG still or deterministic PNG animation sequence beneath the project's
        Saved directory. Multi-frame results include a manifest and are codec-independent source evidence
        for an external video encoder; BAT does not launch arbitrary executables.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetShowcaseCaptureRequest'
      responses:
        '201':
          description: Showcase actor and evidence paths
        '503':
          description: Editor world or active viewport is unavailable
  /actions/list:
    get:
      summary: List registered BAT actions
      responses:
        '200':
          description: Action list
  /actions/run:
    post:
      summary: Run a named BAT action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                args:
                  type: object
      responses:
        '200':
          description: Action run result
  /pcg/spawn_spheres:
    post:
      summary: Duplicate PCG sphere template and spawn a host actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dst_graph]
              properties:
                dst_graph:
                  type: string
                location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                extent:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                mesh:
                  type: string
                count:
                  type: integer
                seed:
                  type: integer
      responses:
        '200':
          description: PCG spawn result
  /jobs/submit:
    post:
      summary: Submit an async job
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSubmitRequest'
      responses:
        '202':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSubmitResponse'
        '400':
          $ref: '#/components/responses/Error400'
  /jobs/{jobId}:
    get:
      summary: Get job status
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/Error404'
  /jobs/{jobId}/cancel:
    post:
      summary: Request cancel for a job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancel requested
        '404':
          $ref: '#/components/responses/Error404'
  /logs/tail:
    get:
      summary: Recent structured logs
      parameters:
        - in: query
          name: n
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        '200':
          description: Recent logs
  /pie/start:
    post:
      summary: Preferred PIE start endpoint
      responses:
        '202':
          description: Job created
  /pie/stop:
    post:
      summary: Preferred PIE stop endpoint
      responses:
        '202':
          description: Job created
  /ai/editor/layout/apply:
    post:
      summary: Submit editor layout apply job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actors]
              properties:
                actors:
                  type: array
                  items:
                    type: object
      responses:
        '202':
          description: Job created
  /ai/plan/validate:
    post:
      summary: Validate a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          description: Validation result
  /ai/plan/apply:
    post:
      summary: Submit a plan apply job
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '202':
          description: Job created
  /blueprint/set-defaults:
    post:
      summary: Set Blueprint class defaults and apply allowlisted component templates
      description: Supports SplineMeshComponent with direct endpoints/tangents or a local-space range sampled from a SplineComponent. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, defaults]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
                defaults:
                  type: object
                  additionalProperties: true
                components_apply:
                  type: array
                  items:
                    $ref: '#/components/schemas/BlueprintComponentApplySpec'
                compile:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Defaults and component-template apply result
        '400':
          $ref: '#/components/responses/Error400'
  /blueprint/create:
    post:
      summary: Submit blueprint creation job
      description: Returns 409 pie_edit_blocked while PIE is running.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                parent:
                  type: string
                compile:
                  type: boolean
      responses:
        '202':
          description: Job created
  /blueprint/compile_save:
    post:
      summary: Preferred Blueprint compile and save endpoint
      description: Compiles a Blueprint and optionally saves it in one request. Returns normalized compiler diagnostics under compileDiagnostics plus top-level errors and warnings. Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                compile:
                  type: boolean
                  default: true
                save:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Blueprint compile/save result
  /blueprint/components/remove:
    post:
      summary: Remove a Blueprint component by name
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, name]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                missing_ok:
                  type: boolean
                  description: When true, no error is returned if the component does not exist.
                compile:
                  type: boolean
                  description: Compile the Blueprint after the remove operation.
      responses:
        '200':
          description: Remove operation result
        '400':
          $ref: '#/components/responses/Error400'
  /blueprint/components/replace:
    post:
      summary: Replace a Blueprint component in-place (remove + add + set)
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, name, class]
              properties:
                blueprint:
                  type: string
                  minLength: 1
                  maxLength: 512
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                class:
                  type: string
                  minLength: 1
                  description: Component class path for the replacement component.
                static_mesh:
                  type: string
                material0:
                  type: string
                mobility:
                  type: string
                relative_location:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                relative_rotation:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                relative_scale3d:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                num_custom_data_floats:
                  type: integer
                start_position:
                  $ref: '#/components/schemas/Vector3'
                start_tangent:
                  $ref: '#/components/schemas/Vector3'
                end_position:
                  $ref: '#/components/schemas/Vector3'
                end_tangent:
                  $ref: '#/components/schemas/Vector3'
                from_spline:
                  $ref: '#/components/schemas/SplineMeshFromSpline'
                start_scale:
                  $ref: '#/components/schemas/Vector2'
                end_scale:
                  $ref: '#/components/schemas/Vector2'
                start_roll:
                  type: number
                  description: Start roll in radians; mutually exclusive with start_roll_degrees.
                start_roll_degrees:
                  type: number
                end_roll:
                  type: number
                  description: End roll in radians; mutually exclusive with end_roll_degrees.
                end_roll_degrees:
                  type: number
                start_offset:
                  $ref: '#/components/schemas/Vector2'
                end_offset:
                  $ref: '#/components/schemas/Vector2'
                forward_axis:
                  type: string
                  enum: [X, Y, Z]
                spline_up_dir:
                  $ref: '#/components/schemas/Vector3'
                smooth_interp_roll_scale:
                  type: boolean
                allow_spline_editing_per_instance:
                  type: boolean
                collision_enabled:
                  type: string
                  enum: [NoCollision, QueryOnly, PhysicsOnly, QueryAndPhysics]
                generate_overlap_events:
                  type: boolean
                cast_shadow:
                  type: boolean
                compile:
                  type: boolean
                  description: Compile the Blueprint after replacement.
      responses:
        '200':
          description: Replace operation result
        '400':
          $ref: '#/components/responses/Error400'
  /blueprint/graph/apply:
    post:
      summary: Canonically apply Blueprint graph edits
      description: Main high-level Blueprint graph editing route for agents. Returns explicit node/link counts, per-node validation issues, compile/save status, and structured compiler diagnostics under compileDiagnostics when compile is requested. Returns 409 pie_edit_blocked while PIE is running. AnimGraph nodes can provide `forward_axis` to remap vector, rotator, quaternion, and transform properties into Unreal's `+X` forward frame before import. Canonical values are `X`, `-X`, `Y`, `-Y`, `Z`, and `-Z`; aliases such as `+Y`, `right`, `left`, `forward`, `backward`, `up`, and `down` are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, graph, nodes, links]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
                options:
                  type: object
                  properties:
                    compile:
                      type: boolean
                    save:
                      type: boolean
                    transaction:
                      type: boolean
                    dryRun:
                      type: boolean
                    createMissingNodes:
                      type: boolean
                      description: When false, node updates must target existing BAT-owned nodes instead of creating missing ones.
                    autoArrangeExistingNodes:
                      type: boolean
                      description: When true, BAT re-aligns the referenced existing BAT-owned nodes using their current graph links after applying changes.
                    autoArrangeConnectedNodes:
                      type: boolean
                      description: When true, BAT expands auto-arrangement from the referenced nodes to connected BAT-owned neighbors and lays out the whole connected subgraph by flow.
                    preserveFeederLanes:
                      type: boolean
                      description: When true, BAT preserves distinct feeder lanes during auto-arrangement and only separates nodes when lanes would overlap, while still centering fan-in nodes from their incoming lanes.
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                        description: Optional for `updateOnly` node patches that target an existing BAT-owned node.
                      updateOnly:
                        type: boolean
                        description: When true, the request updates an existing node in place and fails if the node is missing.
                      x:
                        type: number
                        description: Optional explicit node X position. When omitted for newly created nodes, BAT auto-aligns the node from linked neighbors.
                      y:
                        type: number
                        description: Optional explicit node Y position. When omitted for newly created nodes, BAT auto-aligns the node from linked neighbors.
                      forward_axis:
                        type: string
                        description: Canonical values `X`, `-X`, `Y`, `-Y`, `Z`, and `-Z`; aliases like `+Y`, `right`, `left`, `forward`, `backward`, `up`, and `down` are also accepted.
                      properties:
                        type: object
                        additionalProperties:
                          type: string
                      pins:
                        type: object
                        additionalProperties:
                          type: string
                links:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Graph apply result
  /blueprint/apply:
    post:
      summary: Apply a generic Blueprint edit plan
      description: Returns 409 pie_edit_blocked while PIE is running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, ops]
              properties:
                blueprint:
                  type: string
                ops:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Blueprint plan apply result
  /blueprint/schema:
    post:
      summary: Read Blueprint authoring schema and discovery metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
                include:
                  type: array
                  items:
                    type: string
                function_filter:
                  type: object
                  properties:
                    class:
                      type: string
                    search:
                      type: string
                    blueprint_callable_only:
                      type: boolean
                    exclude_latent:
                      type: boolean
                    exclude_unsafe:
                      type: boolean
                    limit:
                      type: integer
      responses:
        '200':
          description: Blueprint schema result
  /blueprint/graph/read:
    get:
      summary: Preferred Blueprint graph introspection endpoint
      description: Returns graph summaries when only `blueprint` is provided, or a full node/link snapshot when both `blueprint` and `graph` are provided. Optional flags can include selected resolved node properties, machine-readable node validation issues, and graph analysis hints for AI inspection.
      parameters:
        - in: query
          name: blueprint
          required: true
          schema:
            type: string
        - in: query
          name: graph
          schema:
            type: string
        - in: query
          name: includeNodeProperties
          schema:
            type: boolean
        - in: query
          name: includeNodeValidation
          schema:
            type: boolean
          description: When true, includes per-node nodeValidation issues in the response for supported AnimGraph nodes.
        - in: query
          name: includeGraphAnalysis
          schema:
            type: boolean
          description: When true, includes graph-level blend summaries plus per-node stage and pose-space hints in the response.
        - in: query
          name: propertyPaths
          schema:
            type: string
          description: Comma-separated property paths to export from each node. When omitted and `includeNodeProperties=true`, node-type defaults are used for supported AnimGraph nodes.
      responses:
        '200':
          description: Blueprint graph read result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintGraphReadResponse'
  /blueprint/graph/nodes:
    post:
      summary: Read normalized graph node metadata for a Blueprint graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, graph]
              properties:
                blueprint:
                  type: string
                graph:
                  type: string
      responses:
        '200':
          description: Graph nodes snapshot
  /blueprint/graph/links:
    get:
      summary: Read normalized graph nodes and links
      parameters:
        - in: query
          name: blueprint
          required: true
          schema:
            type: string
        - in: query
          name: graph
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Graph links snapshot
  /umg/schema:
    get:
      summary: Discover the native C++ UMG Designer contract
      description: Returns the allowlisted widget types, common editable properties, slot fields, tree limits, and confirms that Python is not required.
      responses:
        '200':
          description: Native UMG Designer schema
  /umg/create:
    post:
      summary: Create a Widget Blueprint without Python
      description: Creates a UWidgetBlueprint with a UUserWidget parent, compiles it, and saves it by default. The asset path must be inside /Game. Returns 409 if the asset already exists and 409 pie_edit_blocked during PIE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, name]
              properties:
                path:
                  type: string
                  example: /Game/UI
                name:
                  type: string
                  example: WBP_ProfessionalDashboard
                parent:
                  type: string
                  default: /Script/UMG.UserWidget
                save:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Widget Blueprint created
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: Asset already exists or PIE blocks the edit
  /umg/designer/read:
    post:
      summary: Read a Widget Blueprint Designer hierarchy
      description: Returns the native widget tree, widget count, class names, common state, child order, and normalized Canvas slot layout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint]
              properties:
                blueprint:
                  type: string
                  example: /Game/UI/WBP_ProfessionalDashboard
      responses:
        '200':
          description: Designer tree snapshot
        '404':
          description: Widget Blueprint not found
  /umg/designer/apply:
    post:
      summary: Atomically apply a professional UMG Designer layout without Python
      description: |
        Builds an allowlisted declarative widget tree in native C++, applies editable widget properties and typed panel-slot layout,
        replaces the Designer root only after the complete tree is valid, compiles with structured diagnostics, and saves only on success.
        If compilation or save fails, the previous root is restored. Supports responsive Canvas anchors, flow fill rules, padding,
        alignment, Grid row/column placement, layered overlays, visual styles, typography, form controls, safe zones, and scrolling.
        Unknown widget types, duplicate names, non-editable properties, invalid child containment, and trees exceeding 500 widgets or
        depth 32 are rejected. Returns 409 pie_edit_blocked during PIE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blueprint, root]
              properties:
                blueprint:
                  type: string
                  example: /Game/UI/WBP_ProfessionalDashboard
                root:
                  $ref: '#/components/schemas/UMGWidgetSpec'
                compile:
                  type: boolean
                  default: true
                save:
                  type: boolean
                  default: true
                  description: Saving forces compilation; the asset is never saved after a compile failure.
      responses:
        '200':
          description: Applied Designer tree, normalized snapshot, compileDiagnostics, and save status
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          description: Invalid tree or compilation failure; previous Designer root remains active
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    UMGWidgetSpec:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          description: Short allowlisted type from /umg/schema, for example CanvasPanel, VerticalBox, TextBlock, Image, Button, or SizeBox.
        name:
          type: string
          description: Unique Designer widget name.
        properties:
          type: object
          additionalProperties: true
          description: Snake_case aliases of editable UMG properties. Delegates, navigation/ownership objects, transient fields, and arbitrary code are rejected.
        slot:
          $ref: '#/components/schemas/UMGSlotSpec'
        children:
          type: array
          items:
            $ref: '#/components/schemas/UMGWidgetSpec'
    UMGSlotSpec:
      type: object
      additionalProperties: true
      description: Layout properties interpreted according to the parent panel's generated slot class.
      properties:
        anchors:
          type: object
          required: [min, max]
          properties:
            min:
              $ref: '#/components/schemas/Vector2'
            max:
              $ref: '#/components/schemas/Vector2'
        offsets:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
          description: Canvas left, top, right, bottom offsets. Right/bottom act as width/height when anchors are not stretched.
        alignment:
          $ref: '#/components/schemas/Vector2'
        position:
          $ref: '#/components/schemas/Vector2'
        size:
          $ref: '#/components/schemas/Vector2'
        auto_size:
          type: boolean
        z_order:
          type: integer
        padding:
          oneOf:
            - type: number
            - type: array
              minItems: 2
              maxItems: 4
              items:
                type: number
        horizontal_alignment:
          type: string
          enum: [left, center, right, fill]
        vertical_alignment:
          type: string
          enum: [top, center, bottom, fill]
        size_rule:
          type: string
          enum: [auto, fill]
        fill_value:
          type: number
          minimum: 0
        row:
          type: integer
          minimum: 0
        column:
          type: integer
          minimum: 0
        row_span:
          type: integer
          minimum: 1
        column_span:
          type: integer
          minimum: 1
        layer:
          type: integer
        nudge:
          $ref: '#/components/schemas/Vector2'
    Vector2:
      oneOf:
        - type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        - type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
    Vector3:
      oneOf:
        - type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        - type: object
          required: [x, y, z]
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
    SplineMeshFromSpline:
      type: object
      required: [component]
      properties:
        component:
          type: string
          description: SplineComponent template name in the same Blueprint.
        start_distance:
          type: number
          default: 0
        end_distance:
          type: number
          description: Defaults to the source spline length and must be greater than start_distance.
        tangent_scale:
          type: number
          minimum: 0
          default: 1
        step:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: ISM/HISM sampling interval; ignored by SplineMeshComponent.
        align_to_tangent:
          type: boolean
          default: true
          description: ISM/HISM option; ignored by SplineMeshComponent.
        offset:
          $ref: '#/components/schemas/Vector3'
        rotation:
          $ref: '#/components/schemas/Vector3'
        scale:
          $ref: '#/components/schemas/Vector3'
    BlueprintComponentApplySpec:
      type: object
      required: [class, name]
      additionalProperties: true
      properties:
        class:
          type: string
          enum:
            - /Script/Engine.InstancedStaticMeshComponent
            - /Script/Engine.HierarchicalInstancedStaticMeshComponent
            - /Script/Engine.SplineComponent
            - /Script/Engine.SplineMeshComponent
        name:
          type: string
          minLength: 1
          maxLength: 128
        static_mesh:
          type: string
        material0:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/Vector3'
        point_type:
          type: string
          enum: [Linear, Curve, Constant, CurveClamped, CurveCustomTangent]
        closed_loop:
          type: boolean
        instances:
          type: array
          items:
            type: object
            additionalProperties: true
        from_spline:
          $ref: '#/components/schemas/SplineMeshFromSpline'
        start_position:
          $ref: '#/components/schemas/Vector3'
        start_tangent:
          $ref: '#/components/schemas/Vector3'
        end_position:
          $ref: '#/components/schemas/Vector3'
        end_tangent:
          $ref: '#/components/schemas/Vector3'
        start_scale:
          $ref: '#/components/schemas/Vector2'
        end_scale:
          $ref: '#/components/schemas/Vector2'
        start_roll:
          type: number
          description: Radians.
        start_roll_degrees:
          type: number
        end_roll:
          type: number
          description: Radians.
        end_roll_degrees:
          type: number
        start_offset:
          $ref: '#/components/schemas/Vector2'
        end_offset:
          $ref: '#/components/schemas/Vector2'
        forward_axis:
          type: string
          enum: [X, Y, Z]
        spline_up_dir:
          $ref: '#/components/schemas/Vector3'
        smooth_interp_roll_scale:
          type: boolean
        allow_spline_editing_per_instance:
          type: boolean
        collision_enabled:
          type: string
          enum: [NoCollision, QueryOnly, PhysicsOnly, QueryAndPhysics]
        generate_overlap_events:
          type: boolean
        cast_shadow:
          type: boolean
        properties:
          type: object
          properties:
            relative_location:
              $ref: '#/components/schemas/Vector3'
            relative_rotation:
              $ref: '#/components/schemas/Vector3'
            relative_scale3d:
              $ref: '#/components/schemas/Vector3'
            mobility:
              type: string
              enum: [Static, Stationary, Movable]
    AssetTargetRequest:
      type: object
      properties:
        path:
          type: string
        target:
          type: string
        paths:
          type: array
          maxItems: 100
          items:
            type: string
        include_dependencies:
          type: boolean
          default: true
        include_referencers:
          type: boolean
          default: false
      anyOf:
        - required: [path]
        - required: [target]
        - required: [paths]
    AssetImportOptions:
      type: object
      properties:
        import_type:
          type: string
          enum: [auto, static_mesh, skeletal_mesh, animation]
          default: auto
        import_mesh:
          type: boolean
        import_animations:
          type: boolean
        import_materials:
          type: boolean
        import_textures:
          type: boolean
        create_physics_asset:
          type: boolean
        import_morph_targets:
          type: boolean
        combine_meshes:
          type: boolean
        convert_scene:
          type: boolean
        convert_scene_unit:
          type: boolean
        force_front_x_axis:
          type: boolean
        skeleton:
          type: string
          description: Existing Skeleton object or package path, required for animation-only FBX import.
    AssetImportSource:
      oneOf:
        - type: string
        - type: object
          properties:
            source:
              type: string
            file:
              type: string
            destination_name:
              type: string
            expected_type:
              type: string
              description: Requires at least one imported asset of this class/type. Companion assets are allowed.
            factory_class:
              type: string
            options_class:
              type: string
            options:
              $ref: '#/components/schemas/AssetImportOptions'
            factory_properties:
              type: object
              additionalProperties: true
            options_properties:
              type: object
              additionalProperties: true
          anyOf:
            - required: [source]
            - required: [file]
    AssetImportRequest:
      type: object
      properties:
        source:
          type: string
        file:
          type: string
        sources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/AssetImportSource'
        destination:
          type: string
          pattern: '^/Game(?:/.*)?$'
        destination_path:
          type: string
          pattern: '^/Game(?:/.*)?$'
        destination_name:
          type: string
        expected_type:
          type: string
          description: Requires at least one imported asset of this class/type. Companion assets are allowed.
        replace_existing:
          type: boolean
          default: false
        replace_existing_settings:
          type: boolean
          default: false
        skip_unchanged:
          type: boolean
          default: true
        save:
          type: boolean
          default: true
        dry_run:
          type: boolean
          default: false
        factory_class:
          type: string
        options_class:
          type: string
        options:
          $ref: '#/components/schemas/AssetImportOptions'
        factory_properties:
          type: object
          additionalProperties: true
        options_properties:
          type: object
          additionalProperties: true
      allOf:
        - anyOf:
            - required: [source]
            - required: [file]
            - required: [sources]
        - anyOf:
            - required: [destination]
            - required: [destination_path]
    AssetConfigureRequest:
      allOf:
        - $ref: '#/components/schemas/AssetTargetRequest'
        - type: object
          properties:
            mode:
              type: string
              enum: [explicit, safe_auto]
              default: explicit
            dry_run:
              type: boolean
              default: false
            save:
              type: boolean
              default: true
            reimport:
              type: boolean
              default: false
            material_assignments:
              type: object
              additionalProperties:
                type: string
              description: Map from slot name, imported slot name, or numeric index to Material asset path.
            texture:
              type: object
              properties:
                srgb:
                  type: boolean
                compression_settings:
                  type: integer
                  description: Unreal TextureCompressionSettings enum numeric value.
            static_mesh:
              type: object
              properties:
                recompute_normals:
                  type: boolean
                recompute_tangents:
                  type: boolean
                generate_lightmap_uvs:
                  type: boolean
                nanite:
                  type: boolean
                create_box_collision:
                  type: boolean
                build:
                  type: boolean
            skeletal_mesh:
              type: object
              properties:
                skeleton:
                  type: string
                create_physics_asset:
                  type: boolean
    AssetValidationRules:
      type: object
      properties:
        require_materials:
          type: boolean
          default: true
        require_source_metadata:
          type: boolean
          description: When true, missing BAT source fingerprint metadata is an error.
        require_collision:
          type: boolean
        require_nanite:
          type: boolean
          description: When true, disabled Nanite is an error.
        require_physics_asset:
          type: boolean
          description: Requires an assigned Physics Asset containing at least one skeletal body.
        minimum_bones:
          type: integer
          minimum: 1
          default: 1
    AssetValidateRequest:
      allOf:
        - $ref: '#/components/schemas/AssetTargetRequest'
        - type: object
          properties:
            profile:
              type: string
              enum: [default, production, strict, fab]
              default: default
            rules:
              $ref: '#/components/schemas/AssetValidationRules'
    AssetPipelineStep:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [import, inspect, configure, repair, validate, showcase, capture]
        payload:
          type: object
          additionalProperties: true
      description: 'Fields may be placed directly on the step or under payload. Use `path: "$imported"` to consume the latest import context.'
    AssetPipelineRequest:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/AssetPipelineStep'
        async:
          type: boolean
          default: false
        dry_run:
          type: boolean
          default: false
        rollback_on_failure:
          type: boolean
          default: true
        continue_on_error:
          type: boolean
          default: false
    AssetShowcaseCaptureRequest:
      type: object
      required: [asset]
      properties:
        asset:
          type: string
          description: Static Mesh or Skeletal Mesh asset path.
        animation:
          type: string
          description: Optional AnimSequence for a Skeletal Mesh showcase.
        actor_label:
          type: string
        location:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        rotation:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        scale:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        capture:
          type: boolean
          default: true
        output_folder:
          type: string
          description: Relative directory beneath the project's Saved directory.
        frame_count:
          type: integer
          minimum: 1
          maximum: 1000
        fps:
          type: integer
          minimum: 1
          maximum: 120
    LevelActorFilterRequest:
      type: object
      properties:
        by:
          type: string
          enum: [label, name, class, tag, folder]
        value:
          type: string
        label:
          type: string
        actorLabel:
          type: string
        labels:
          type: array
          items:
            type: string
        labelPrefix:
          type: string
        labelSuffix:
          type: string
        labelContains:
          type: string
        labelNotContains:
          type: string
        name:
          type: string
        actorName:
          type: string
        names:
          type: array
          items:
            type: string
        class:
          type: string
        className:
          type: string
        classNames:
          type: array
          items:
            type: string
        classes:
          type: array
          items:
            type: string
        classContains:
          type: string
        folder:
          type: string
        folderPath:
          type: string
        folderPrefix:
          type: string
        folderContains:
          type: string
        tag:
          type: string
        tags:
          type: array
          items:
            type: string
        includeHidden:
          type: boolean
          default: true
        includeTransient:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 5000
    Issue:
      type: object
      required: [code, message, recoverable]
      properties:
        code:
          type: string
        message:
          type: string
        recoverable:
          type: boolean
        target:
          type: string
        suggestedAction:
          type: string
        details:
          type: object
          additionalProperties: true
    BlueprintGraphReadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                graph:
                  $ref: '#/components/schemas/BlueprintGraphSnapshot'
    BlueprintGraphSnapshot:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        nodeCount:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintGraphNode'
        links:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintGraphLink'
        analysis:
          $ref: '#/components/schemas/BlueprintGraphAnalysis'
    BlueprintGraphNode:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        properties:
          type: object
          additionalProperties:
            type: string
        propertyWarnings:
          type: array
          items:
            type: string
        nodeValidation:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintGraphNodeValidationIssue'
        analysis:
          $ref: '#/components/schemas/BlueprintGraphNodeAnalysis'
    BlueprintGraphLink:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
    BlueprintGraphNodeValidationIssue:
      type: object
      properties:
        nodeId:
          type: string
        code:
          type: string
        severity:
          type: string
        message:
          type: string
        propertyPath:
          type: string
    BlueprintGraphAnalysis:
      type: object
      properties:
        rootNodeIds:
          type: array
          items:
            type: string
        blendNodes:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintGraphBlendNodeSummary'
    BlueprintGraphBlendNodeSummary:
      type: object
      properties:
        nodeId:
          type: string
        basePoseSourceNodeId:
          type: string
        overlaySources:
          type: array
          items:
            type: object
            properties:
              inputPin:
                type: string
              sourceNodeId:
                type: string
    BlueprintGraphNodeAnalysis:
      type: object
      properties:
        reachesRoot:
          type: boolean
        rootDistance:
          type: integer
        stage:
          type: string
        nearestBlendNodeId:
          type: string
        nearestBlendInputPin:
          type: string
        primaryInputPoseSpace:
          type: string
        primaryOutputPoseSpace:
          type: string
    ApiEnvelope:
      type: object
      required: [ok, requestId, data, warnings, errors]
      properties:
        ok:
          type: boolean
        requestId:
          type: string
        data:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    ReflectionObjectRequest:
      type: object
      properties:
        target:
          type: string
          description: Canonical target identifier. When provided without a more specific field, path-like values resolve as objectPath and plain names resolve as actorName.
        path:
          type: string
          description: Legacy alias for objectPath.
        objectPath:
          type: string
        softObjectPath:
          type: string
        actorName:
          type: string
        selectedActor:
          type: boolean
        blueprintAssetPath:
          type: string
        classPath:
          type: string
        requiredClass:
          type: string
        worldContext:
          type: string
          enum: [Editor, PIE, editor, pie]
        pieIndex:
          type: integer
        responseOutputPath:
          type: string
          description: Optional relative file path under the toolkit response export directory. When set, the HTTP response body is also written to disk and the request requires filesystem permission.
      description: Provide at least one object resolution field.
    ReflectionResolveRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
    ReflectionGetRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          properties:
            properties:
              type: array
              items:
                type: string
    ReflectionDescribeRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          properties:
            verbose:
              type: boolean
            propertyLimit:
              type: integer
            functionLimit:
              type: integer
            valueLimit:
              type: integer
    ReflectionSetPropertyRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          properties:
            property:
              type: string
            value:
              description: Reflected value to assign.
              nullable: true
            values:
              type: object
              additionalProperties: true
          anyOf:
            - required: [property, value]
            - required: [values]
    ReflectionCallFunctionRequest:
      allOf:
        - $ref: '#/components/schemas/ReflectionObjectRequest'
        - type: object
          required: [function]
          properties:
            function:
              type: string
            arguments:
              type: object
              additionalProperties: true
            args:
              type: object
              additionalProperties: true
    ReflectionStructuredResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
    JobSubmitRequest:
      type: object
      required: [kind, payload]
      properties:
        kind:
          type: string
          minLength: 1
        payload:
          type: object
          additionalProperties: true
    JobSubmitResponse:
      type: object
      required: [jobId, requestId]
      properties:
        jobId:
          type: string
        requestId:
          type: string
    JobStatus:
      type: object
      required: [jobId, state, progress, requestId, logs]
      properties:
        jobId:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        progress:
          type: number
        requestId:
          type: string
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
        logs:
          type: array
          items:
            type: string
    PlanRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          items:
            type: object
            required: [op, payload]
            properties:
              op:
                type: string
              undoable:
                type: boolean
              payload:
                type: object
                additionalProperties: true
  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
